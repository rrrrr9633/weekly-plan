server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: weekly-plan-server
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/weekly-plan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-32-byte-minimum-key}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:43200}
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    wire-api: ${AI_WIRE_API:responses}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:180}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin12345}
  bootstrap-super-admin:
    username: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME:超级管理员}
